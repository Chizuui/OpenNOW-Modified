# Standalone, plug-and-play Windows installer build for forks.
# Runs on GitHub-hosted windows-latest (NOT Blacksmith), needs no secrets.
# Trigger from the Actions tab -> "Build Windows installer" -> Run workflow.
# Produces: OpenNOW-Qt-<version>-Windows-x64.msi, .zip (portable), -setup.exe.
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version major.minor.patch (e.g. 1.0.3)"
        type: string
        default: "1.0.3"

permissions:
  contents: read

env:
  SDL_VERSION: release-3.2.20
  QT_VERSION: "6.8.3"
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Map workspace to O: (short build path)"
        shell: pwsh
        run: .github/scripts/map-windows-workspace.ps1

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false
          workspaces: |
            native/opennow-core -> target
            native/opennow-streamer -> target
            native/opennow-core -> ../../build/opennow-qt-release/rust-target
            native/opennow-core -> ../../build/opennow-qt-release/update-helper-rust-target
            native/opennow-streamer -> ../../build/opennow-qt-release/streamer-rust-target

      - name: Install LLVM (libclang for Rust bindgen)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) { throw "LLVM missing libclang.dll" }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install WiX Toolset v3.14 (MSI generator)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          $wixBin = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14/bin"
          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) { throw "WiX missing candle.exe" }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: qt-win-x64

      - name: Build and cache SDL3
        uses: ./.github/actions/sdl3
        with:
          version: ${{ env.SDL_VERSION }}
          target-arch: x64
          parallel: 4

      - name: Bound Rust jobs and pin MSVC linker
        shell: pwsh
        run: |
          "CARGO_BUILD_JOBS=4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $linker)) { throw "MSVC x64 linker not found" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Release)
        shell: bash
        run: |
          cd /o
          cmake -S opennow-qt -B build/opennow-qt-release \
            -G "Ninja Multi-Config" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENNOW_BUILD_VERSION="${{ inputs.version }}" \
            -DOPENNOW_UPDATE_ED25519_PUBLIC_KEY="" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL-install"

      - name: Build
        shell: bash
        run: |
          cd /o
          cmake --build build/opennow-qt-release --config Release --parallel 4

      - name: Package MSI + portable ZIP
        shell: bash
        run: |
          cd /o
          mkdir -p build/qt-packages
          cpack --config build/opennow-qt-release/CPackConfig.cmake \
            -C Release -G "WIX;ZIP" -B build/qt-packages

      - name: Build setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = @(Get-ChildItem build/qt-packages -Filter *.zip)
          if ($zip.Count -ne 1) { throw "Expected one portable ZIP" }
          $payload = Join-Path $env:RUNNER_TEMP "setup-payload"
          if (Test-Path $payload) { Remove-Item $payload -Recurse -Force }
          Expand-Archive $zip[0].FullName $payload
          $setup = Join-Path (Resolve-Path build/qt-packages) ([IO.Path]::GetFileNameWithoutExtension($zip[0].Name) + "-setup.exe")
          ./opennow-qt/packaging/windows/build-setup.ps1 -Payload $payload -Version "${{ inputs.version }}" -Arch x64 -OutputFile $setup

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: opennow-windows-x64-${{ inputs.version }}
          path: |
            build/qt-packages/*.msi
            build/qt-packages/*.zip
            build/qt-packages/*-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
